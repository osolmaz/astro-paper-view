name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.19.1
      - name: Check release revision and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Release tag must match package version");'
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); const r = await fetch(`https://registry.npmjs.org/${p.name}/${p.version}`); if (r.status !== 404) throw new Error(`Version check returned ${r.status}; publication stopped`);'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm test
      - run: pnpm test:mutation && pnpm dry && pnpm quality && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: npm publish --provenance --access public
      - name: Verify registry publication
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          npm view "astro-paper-view@$VERSION" version dist.integrity
